<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="sourceGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="analystGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="researchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="auditGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="leadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="reworkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="1200" fill="url(#bgGrad)" rx="16"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#94a3b8" font-size="11" letter-spacing="3" font-weight="500">S2D LAB</text>
  <text x="450" y="62" text-anchor="middle" fill="#f1f5f9" font-size="22" font-weight="700">Verifier &amp; Rework Loop</text>
  <text x="450" y="82" text-anchor="middle" fill="#64748b" font-size="11">Technical workflow with bounded cycles</text>

  <!-- Step 1: Source Intake -->
  <rect x="280" y="105" width="340" height="64" rx="10" fill="url(#sourceGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="127" text-anchor="middle" fill="#64748b" font-size="9" letter-spacing="2" font-weight="600">1. SOURCE INTAKE</text>
  <text x="450" y="146" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Store conversation in runs/.work/&lt;run-id&gt;/source.md</text>
  <text x="450" y="162" text-anchor="middle" fill="#64748b" font-size="10">git-ignored · accessible to all auditor invocations</text>

  <!-- Arrow -->
  <line x1="450" y1="169" x2="450" y2="194" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2: Question Map v1 -->
  <rect x="80" y="198" width="280" height="74" rx="10" fill="#1a0a2e" stroke="#6d28d9" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="80" y="198" width="280" height="3" rx="1.5" fill="url(#analystGrad)"/>
  <text x="220" y="220" text-anchor="middle" fill="#a78bfa" font-size="9" letter-spacing="1.5" font-weight="600">2. CONVERSATION ANALYST</text>
  <text x="220" y="241" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Question Map v1</text>
  <text x="220" y="260" text-anchor="middle" fill="#7c3aed" font-size="10">01-question-map-v1.md</text>

  <!-- Arrow -->
  <line x1="360" y1="235" x2="384" y2="235" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3: Research Packet v1 -->
  <rect x="384" y="198" width="280" height="74" rx="10" fill="#031a23" stroke="#0e7490" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="384" y="198" width="280" height="3" rx="1.5" fill="url(#researchGrad)"/>
  <text x="524" y="220" text-anchor="middle" fill="#67e8f9" font-size="9" letter-spacing="1.5" font-weight="600">3. QUANT RESEARCHER</text>
  <text x="524" y="241" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Research Packet v1</text>
  <text x="524" y="260" text-anchor="middle" fill="#22d3ee" font-size="10">02-research-packet-v1.md</text>

  <!-- Arrow down -->
  <line x1="524" y1="272" x2="524" y2="297" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4: Research Audit (cycle 0) -->
  <rect x="280" y="301" width="380" height="80" rx="10" fill="#1c0f00" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="301" width="380" height="3" rx="1.5" fill="url(#auditGrad)"/>
  <text x="470" y="323" text-anchor="middle" fill="#fcd34d" font-size="9" letter-spacing="1.5" font-weight="600">4. INDEPENDENT AUDITOR (cycle 0)</text>
  <text x="470" y="343" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Review Question Map + Research Packet</text>
  <text x="470" y="362" text-anchor="middle" fill="#78350f" font-size="10">receives: original source + both artifacts</text>
  <text x="470" y="376" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Verdict: PASS / PASS_WITH_LIMITATIONS / CHANGES_REQUESTED / BLOCKED</text>

  <!-- Decision diamond -->
  <path d="M 470 381 L 540 431 L 470 481 L 400 431 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="470" y="426" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">BLOCKER</text>
  <text x="470" y="441" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">or MAJOR?</text>

  <!-- YES path - Rework loop -->
  <line x1="540" y1="431" x2="720" y2="431" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="630" y="422" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="600">YES</text>

  <!-- Rework box -->
  <rect x="720" y="320" width="160" height="220" rx="10" fill="#1c0909" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <rect x="720" y="320" width="160" height="3" rx="1.5" fill="url(#reworkGrad)"/>
  <text x="800" y="340" text-anchor="middle" fill="#fca5a5" font-size="9" letter-spacing="1.5" font-weight="600">5. REWORK LOOP</text>
  
  <text x="800" y="362" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="600">Change Request</text>
  <text x="800" y="378" text-anchor="middle" fill="#7f1d1d" font-size="9">CR with defect, owner,</text>
  <text x="800" y="391" text-anchor="middle" fill="#7f1d1d" font-size="9">acceptance criteria</text>
  
  <line x1="740" y1="398" x2="860" y2="398" stroke="#7f1d1d" stroke-width="1"/>
  
  <text x="800" y="414" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="600">Producer v2/v3/v4</text>
  <text x="800" y="430" text-anchor="middle" fill="#7f1d1d" font-size="9">+ resolution notes</text>
  
  <line x1="740" y1="437" x2="860" y2="437" stroke="#7f1d1d" stroke-width="1"/>
  
  <text x="800" y="453" text-anchor="middle" fill="#fecaca" font-size="11" font-weight="600">Auditor recheck</text>
  <text x="800" y="469" text-anchor="middle" fill="#7f1d1d" font-size="9">affected scope +</text>
  <text x="800" y="482" text-anchor="middle" fill="#7f1d1d" font-size="9">dependent claims</text>
  
  <line x1="740" y1="489" x2="860" y2="489" stroke="#7f1d1d" stroke-width="1"/>
  
  <text x="800" y="506" text-anchor="middle" fill="#ef4444" font-size="10" font-weight="700">Max 3 cycles</text>
  <text x="800" y="522" text-anchor="middle" fill="#7f1d1d" font-size="9">then ESCALATE</text>
  <text x="800" y="535" text-anchor="middle" fill="#7f1d1d" font-size="9">never cycle 4</text>

  <!-- Return arrow from rework -->
  <path d="M 800 540 L 800 580 L 540 580 L 540 431" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRed)" fill="none"/>
  <text x="670" y="572" text-anchor="middle" fill="#dc2626" font-size="9">recheck</text>

  <!-- NO path - Continue -->
  <line x1="470" y1="481" x2="470" y2="555" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="520" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">NO (PASS)</text>

  <!-- Step 6: Synthesis -->
  <rect x="280" y="559" width="380" height="70" rx="10" fill="#172554" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="559" width="380" height="3" rx="1.5" fill="url(#leadGrad)"/>
  <text x="470" y="581" text-anchor="middle" fill="#93c5fd" font-size="9" letter-spacing="1.5" font-weight="600">6. RESEARCH LEAD — SYNTHESIS</text>
  <text x="470" y="602" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Final Report v1</text>
  <text x="470" y="621" text-anchor="middle" fill="#60a5fa" font-size="10">04-final-report-v1.md</text>

  <!-- Arrow -->
  <line x1="470" y1="629" x2="470" y2="654" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7: Final Report Audit -->
  <rect x="280" y="658" width="380" height="86" rx="10" fill="#1c0f00" stroke="#b45309" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="658" width="380" height="3" rx="1.5" fill="url(#auditGrad)"/>
  <text x="470" y="680" text-anchor="middle" fill="#fcd34d" font-size="9" letter-spacing="1.5" font-weight="600">7. INDEPENDENT AUDITOR — FINAL REPORT</text>
  <text x="470" y="700" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Audit participant-facing report</text>
  <text x="470" y="719" text-anchor="middle" fill="#78350f" font-size="10">receives: source + report + question map + research packet</text>
  <text x="470" y="735" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Check: fidelity · attribution · citations · unsupported claims</text>

  <!-- Decision diamond 2 -->
  <path d="M 470 744 L 540 794 L 470 844 L 400 794 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="470" y="789" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">BLOCKER</text>
  <text x="470" y="804" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">unresolved?</text>

  <!-- YES path - Block release -->
  <line x1="540" y1="794" x2="690" y2="794" stroke="#dc2626" stroke-width="2"/>
  <text x="615" y="785" text-anchor="middle" fill="#dc2626" font-size="10" font-weight="600">YES</text>
  
  <rect x="690" y="760" width="190" height="68" rx="10" fill="#1c0909" stroke="#dc2626" stroke-width="2"/>
  <text x="785" y="782" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="700">ESCALATE</text>
  <text x="785" y="800" text-anchor="middle" fill="#7f1d1d" font-size="10">No verified release</text>
  <text x="785" y="816" text-anchor="middle" fill="#7f1d1d" font-size="9">Report to owner with findings</text>

  <!-- NO path - Release -->
  <line x1="470" y1="844" x2="470" y2="918" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="490" y="881" text-anchor="middle" fill="#10b981" font-size="10" font-weight="600">NO (PASS)</text>

  <!-- Step 8: Release -->
  <rect x="240" y="922" width="460" height="96" rx="12" fill="#021f14" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="240" y="922" width="460" height="4" rx="2" fill="url(#outputGrad)"/>
  <text x="470" y="946" text-anchor="middle" fill="#34d399" font-size="10" letter-spacing="2" font-weight="600">8. RELEASE GATE ✓</text>
  <text x="470" y="970" text-anchor="middle" fill="#f1f5f9" font-size="15" font-weight="700">Copy to runs/YYYY-MM-DD-conversation-research-recap.md</text>
  <text x="470" y="993" text-anchor="middle" fill="#6ee7b7" font-size="11">Verified · No unresolved blockers · Quality assured</text>
  <text x="470" y="1010" text-anchor="middle" fill="#065f46" font-size="10">User receives one clean, participant-facing report</text>

  <!-- Legend -->
  <rect x="60" y="1050" width="780" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="450" y="1072" text-anchor="middle" fill="#94a3b8" font-size="10" letter-spacing="2" font-weight="600">LEGEND</text>
  
  <rect x="80" y="1084" width="16" height="16" rx="3" fill="url(#analystGrad)"/>
  <text x="106" y="1095" fill="#e2e8f0" font-size="10">Conversation Analyst</text>
  
  <rect x="260" y="1084" width="16" height="16" rx="3" fill="url(#researchGrad)"/>
  <text x="286" y="1095" fill="#e2e8f0" font-size="10">Quant Researcher</text>
  
  <rect x="420" y="1084" width="16" height="16" rx="3" fill="url(#auditGrad)"/>
  <text x="446" y="1095" fill="#e2e8f0" font-size="10">Independent Auditor (read-only)</text>
  
  <rect x="640" y="1084" width="16" height="16" rx="3" fill="url(#leadGrad)"/>
  <text x="666" y="1095" fill="#e2e8f0" font-size="10">Research Lead</text>
  
  <rect x="80" y="1112" width="16" height="16" rx="3" fill="url(#reworkGrad)"/>
  <text x="106" y="1123" fill="#fca5a5" font-size="10">Rework loop (max 3 cycles)</text>
  
  <rect x="280" y="1112" width="16" height="16" rx="3" fill="url(#outputGrad)"/>
  <text x="306" y="1123" fill="#6ee7b7" font-size="10">Verified release</text>
  
  <line x1="450" y1="1116" x2="480" y2="1116" stroke="#dc2626" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="490" y="1123" fill="#fca5a5" font-size="10">CR/recheck flow</text>
  
  <line x1="600" y1="1116" x2="630" y2="1116" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="1123" fill="#6ee7b7" font-size="10">Pass flow</text>

  <!-- Bottom note -->
  <text x="450" y="1190" text-anchor="middle" fill="#1e293b" font-size="9">State persisted in runs/.work/&lt;run-id&gt;/state.yaml · Audit trail maintained · Source traceability ensured</text>
</svg>
